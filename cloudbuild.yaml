# Google Cloud Build Configuration
# This file defines the steps to build and deploy the application to Cloud Run
substitutions:
  _TAG: 'latest'

steps:
  # Step 1: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/exampapersys/app:${_TAG}'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/exampapersys/app:latest'
      - '.'
    timeout: 1200s

  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/exampapersys/app'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'exampapersys'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/exampapersys/app:${_TAG}'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--timeout=300'
      - '--concurrency=80'
      - '--min-instances=0'
      - '--max-instances=1'
      - '--set-env-vars=FRONTEND_URL=https://exam-paper-893028988766.us-central1.run.app'
      - '--set-env-vars=CORS_ORIGINS=https://exam-paper-893028988766.us-central1.run.app'
      - '--set-secrets=GEMINI_API_KEY=gemini-api-key:latest'
      - '--set-secrets=QWEN_API_KEY=qwen-api-key:latest'
      - '--set-secrets=JWT_SECRET=jwt-secret:latest'
      - '--set-env-vars=SMTP_USER=michu1415926535@gmail.com'
      - '--set-secrets=SMTP_PASSWORD=smtp-password:latest'
      - '--set-env-vars=SMTP_HOST=smtp.gmail.com'
      - '--set-env-vars=SMTP_PORT=587'
      - '--set-env-vars=SMTP_FROM=michu1415926535@gmail.com'
      - '--set-env-vars=DEFAULT_AI_MODEL=gemini'
      - '--set-env-vars=DEV_MODE=false'

# Images to be pushed to registry
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/exampapersys/app:${_TAG}'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/exampapersys/app:latest'

# Build timeout (20 minutes)
timeout: 1200s

# Build options
options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
